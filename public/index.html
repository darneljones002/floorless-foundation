<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

      name="description"
      content="A Place to Sleep, A Chance to Learn"
    />

    <meta property="og:type" content="website" />

      property="og:title"
      content="The Floorless Foundation | A Place to Sleep, A Chance to Learn"

      property="og:description"

      name="twitter:title"
      content="The Floorless Foundation | A Place to Sleep, A Chance to Learn"
    />

      name="twitter:description"
      content="The Floorless Foundation provides sleeping kits and STEM experiences for people experiencing homelessness — powered by passionate students and campus partners."
    />

    <link rel="manifest" href="%PUBLIC_URL%/manifest.json" />

          "jobTitle": "Chair"
